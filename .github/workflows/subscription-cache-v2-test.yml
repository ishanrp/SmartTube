name: Subscription Cache V2 Test APK

on:
  push:
    branches: [ "subscription-cache-v2" ]
  workflow_dispatch:

concurrency:
  group: subscription-cache-v2-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'


      - name: Prepare stable cache-v2 test signing
        shell: bash
        env:
          CACHEV2_KEYSTORE_B64: ${{ secrets.CACHEV2_KEYSTORE_B64 }}
          CACHEV2_KEYSTORE_PASSWORD: ${{ secrets.CACHEV2_KEYSTORE_PASSWORD }}
          CACHEV2_KEY_ALIAS: ${{ secrets.CACHEV2_KEY_ALIAS }}
          CACHEV2_KEY_PASSWORD: ${{ secrets.CACHEV2_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CACHEV2_KEYSTORE_B64" || -z "$CACHEV2_KEYSTORE_PASSWORD" || -z "$CACHEV2_KEY_ALIAS" || -z "$CACHEV2_KEY_PASSWORD" ]]; then
            echo "::error::Cache-v2 signing secrets are not configured."
            exit 1
          fi

          umask 077
          printf '%s' "$CACHEV2_KEYSTORE_B64" | base64 --decode > cachev2-test.keystore
          {
            printf 'storeFile=../cachev2-test.keystore\n'
            printf 'storePassword=%s\n' "$CACHEV2_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$CACHEV2_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$CACHEV2_KEY_PASSWORD"
          } > keystore.properties

          export CACHEV2_STOREPASS="$CACHEV2_KEYSTORE_PASSWORD"
          keytool -list -keystore cachev2-test.keystore -storepass:env CACHEV2_STOREPASS -alias "$CACHEV2_KEY_ALIAS" >/dev/null

      - name: Mark as cache v2 test build
        id: get_version
        run: |
          sed -i "s/versionName \"\\(.*\\)\"/versionName \"\\1-cachev2-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Test RSS cache models
        run: ./gradlew :youtubeapi:testStbetaDebugUnitTest --tests com.liskovsoft.youtubeapi.rss.RssCacheModelsTest

      - name: Build installable debug APK
        run: ./gradlew clean assembleStbetaDebug

      - name: Upload Universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_universal
          path: ./smarttubetv/build/outputs/apk/stbeta/debug/*_universal.apk
          if-no-files-found: error

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_arm64
          path: ./smarttubetv/build/outputs/apk/stbeta/debug/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f cachev2-test.keystore keystore.properties

